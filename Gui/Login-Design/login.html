
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Network Monitor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('gui_asset', filename='Login-Design/login.css') }}">
</head>

<body>
    <header class="app-header">
        <img src="{{ url_for('static', filename='icons/hexagonal-tech-logo.svg') }}" class="app-logo" alt="Network Monitor logo">
        <h1 class="logo-text">Network Monitor Intelligent Traffic Engineering and QoS</h1>
    </header>
    <nav class="sidebar" aria-label="Main navigation">
        <a href="{{ url_for('index') }}">Network Monitor</a>
        <a href="{{ url_for('traffic_page') }}">Traffic Manager</a>
        <a href="{{ url_for('qos_page') }}">QoS Configurations</a>
        <a href="{{ url_for('login_page') }}" aria-current="page">Login</a>
    </nav>
    <main class="page-content">
        <div class="center">
            <div class="login-block">
                <div class="inside-center">
                    <div>
                        <img src="{{ url_for('gui_asset', filename='Login-Design/icons/profile-icon.svg') }}" alt="Profile icon" class="profile-icon">
                        <input type="text" id="username" placeholder="Enter Username" class="input-field" autocomplete="username">
                        <input type="password" id="password" placeholder="Enter Password" class="input-field" autocomplete="current-password">
                        <button class="login-button" type="button" onclick="login()">Login</button>
                        <p id="message" role="status" aria-live="polite"></p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="{{ url_for('gui_asset', filename='Login-Design/login.js') }}"></script>
</body>
</html>
