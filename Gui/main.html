<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mininet Network Monitor</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">


    <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
</head>

<body>


    <main>
        <div class = "network-page">
            <div class = "header">
                <img src="{{ url_for('static', filename='icons/hexagonal-tech-logo.svg') }}" class = "logo">
                <h1 class = "logo-text">Network Monitor Intelligent Traffic Engineering and QoS</h1>
            </div>

            <div class = "sidebar"> </div>

            <section class="network-section">
                        <h2>Network Topology</h2>
                        <div id="network"></div>
            </section>


            <div class="key">
                <p class="Summary">Network Summary</p>
            
                <div class="summary-box">
                    <img src="{{ url_for('static', filename='icons/host-device.svg') }}" class="host-img">
                    <p class="host">Hosts: 57</p>
                </div>
            
                <div class="summary-box">
                    <img src="{{ url_for('static', filename='icons/router-icon.svg') }}" class="router-img">
                    <p class="routers">Routers: 3</p>
                </div>
            
                <div class="summary-box">
                    <img src="{{ url_for('static', filename='icons/server-rack.svg') }}" class="switch-icon">
                    <p class="Switches">Switches: 9</p>
                </div>

                <div class="summary-box">
                    <img src="{{ url_for('static', filename='icons/connected-devices-card.svg') }}" class="link-icons">
                    <p class="links">Links: 65</p>
                </div>
            </div>
            

            <div class = "network-performance"> 
                <p>Network Overall Performance</p>
                <div id="performance-panel"></div>

            </div>


            <div class = "details-block">
                <aside class="details-section">
                    <h2>Node Details</h2>
                    <p>Select a host, switch, or router to view its information.</p>
                    <div id="stats-panel"></div>
            
                </aside>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='network.js') }}"></script>

</body>
</html>
