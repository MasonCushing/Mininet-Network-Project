
<!DOCTYPE html>
<html lang="en">
<head>

    <title>QoS Configurations | Network Monitor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('gui_asset', filename='Qos-Config/Qos.css') }}">
</head>

<body>
    <header class="app-header">
        <img src="{{ url_for('static', filename='icons/hexagonal-tech-logo.svg') }}" class="app-logo" alt="Network Monitor logo">

    </header>
    <nav class="sidebar" aria-label="Main navigation">
        <a href="{{ url_for('index') }}">Network Monitor</a>
